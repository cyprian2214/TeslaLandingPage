<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>Tesla</title>
  <link rel="icon" type="image/x-icon" href="./Assets/icons8-tesla-color-144.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Video -->
  <video autoplay muted loop id="background-video">
    <source src="./Assets/Model-3-Performance-End-of-Page-Desktop-LHD.webm" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- Navigation -->
  <div class="navbar-wrapper">
    <nav class="navbar">
      <!-- Left: Tesla Logo -->
      <a href="https://www.tesla.com" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Tesla%2C_Inc._-_Logo_%28black_script_version%29.svg/960px-Tesla%2C_Inc._-_Logo_%28black_script_version%29.svg.png?20230226234005"
          class="top-left-image" alt="Tesla Logo" />
      </a>

      <!--Nav Links -->
      <div class="nav-links">
        <span>Vehicles</span>
        <span>Energy</span>
        <span>Charging</span>
        <span>Discover</span>
        <span>Support</span>
        <span>Shop</span>
      </div> 

      <!--Icons -->
      <div class="icon-container">
        <a href="https://www.tesla.com/support"><img src="./Assets/support-svgrepo-com.svg" alt="Support" /></a>
        <a href="https://github.com/cyprian2214"><img src="./Assets/globe-svgrepo-com.svg" alt="Global" /></a>
        <a href="https://www.tesla.com/teslaaccount"><img src="./Assets/account-settings-svgrepo-com.svg" alt="Account" /></a>
      </div>
    </nav>
  </div>

  <!-- Center Content -->
  <div class="center-content">
    <h1 class="model">Model Y</h1>
    <h3 class="price">Starting at $41,490</h3>
    <h4 class="price2">After $7,500 Federal Tax Credit</h4>
    <div class="button-row">
      <a href="https://www.tesla.com/modely/design" class="order-button">Order Now</a>
      <a href="https://www.tesla.com/modely" class="learn-button">Learn More</a>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>© 2025 Zaio Tesla Landing Page Project, Inc. All rights reserved.</p>
    <p>Privacy & Legal</p>
    <p>Contact</p>
    <p>Careers</p>
    <p>News</p>
    <p>Engage with us on social media:</p>
    <div class="social-media-icons">
      <a href="https://www.facebook.com/cyprian.ndivhuwo" target="_blank"><img src="./Assets/facebook-svgrepo-com.svg" alt="Facebook"></a>
      <a href="https://x.com/Nc_Mash" target="_blank"><img src="./Assets/twitter-svgrepo-com.svg" alt="Twitter"></a>
      <a href="https://www.instagram.com/nc_mash/" target="_blank"><img src="./Assets/instagram-svgrepo-com.svg" alt="Instagram"></a>
      <a href="https://www.linkedin.com/in/ndivhuwo-mashau/" target="_blank"><img src="./Assets/linkedin-svgrepo-com.svg" alt="LinkedIn"></a>
    </div>
  </div>
</body>
</html>
